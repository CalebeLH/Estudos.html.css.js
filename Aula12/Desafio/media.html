<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Calcular média</title>
    <link rel='stylesheet' href='main.css'>
    <script src="media.js" defer></script>
</head>
<body>
    <h1>Calcular Média</h1>
    <input type="text" id="nome" placeholder="Digite seu nome"><br>
    <input type="number" id="nota1" placeholder="Primeira nota"><br>
    <input type="number" id="nota2" placeholder="Segunda nota"><br>
    <input type="number" id="nota3" placeholder="Terceira nota"><br>
    <button id="calcular">Calcular Média</button>
    <p id="resultado"></p>
</body>
</html>
